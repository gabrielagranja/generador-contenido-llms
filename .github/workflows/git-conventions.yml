name: Git Conventions

on:
  pull_request:
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    name: Validate branch and commit conventions
    runs-on: ubuntu-latest
    steps:
      - name: Detect pull-request push
        id: push_origin
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              per_page: 1,
            });
            core.setOutput('is_pr_push', pullRequests.length > 0 ? 'true' : 'false');

      - name: Check out repository with history
        if: github.event_name == 'pull_request' || steps.push_origin.outputs.is_pr_push != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: github.event_name == 'pull_request' || steps.push_origin.outputs.is_pr_push != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate pull-request branch and commits
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python scripts/validate_git_conventions.py
          --branch "${{ github.head_ref }}"
          --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          --repository "${{ github.repository }}"
          --verify-issues

      - name: Validate commits pushed to dev
        if: github.event_name == 'push' && steps.push_origin.outputs.is_pr_push != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python scripts/validate_git_conventions.py
          --range "${{ github.event.before }}..${{ github.sha }}"
          --repository "${{ github.repository }}"
          --verify-issues
