name: SDD Harness

on:
  pull_request:
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate OpenSpec governance
    runs-on: ubuntu-latest
    steps:
      - name: Detect pull-request push
        id: push_origin
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              per_page: 1,
            });
            core.setOutput('is_pr_push', pullRequests.length > 0 ? 'true' : 'false');

      - name: Check out repository
        if: github.event_name == 'pull_request' || steps.push_origin.outputs.is_pr_push != 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: github.event_name == 'pull_request' || steps.push_origin.outputs.is_pr_push != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        if: github.event_name == 'pull_request' || steps.push_origin.outputs.is_pr_push != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        if: github.event_name == 'pull_request' || steps.push_origin.outputs.is_pr_push != 'true'
        run: python -m pip install -r requirements.txt

      - name: Install OpenSpec
        if: github.event_name == 'pull_request' || steps.push_origin.outputs.is_pr_push != 'true'
        run: npm install --global @fission-ai/openspec@1.13.2

      - name: Validate project schema
        if: github.event_name == 'pull_request' || steps.push_origin.outputs.is_pr_push != 'true'
        run: openspec schema validate sdd-governance

      - name: Validate active OpenSpec changes
        if: github.event_name == 'pull_request' || steps.push_origin.outputs.is_pr_push != 'true'
        run: openspec validate --all --json

      - name: Validate required contract fields
        if: github.event_name == 'pull_request' || steps.push_origin.outputs.is_pr_push != 'true'
        run: python scripts/validate_sdd_contract.py

      - name: Run configured application tests
        if: github.event_name == 'pull_request' || steps.push_origin.outputs.is_pr_push != 'true'
        run: python scripts/run_project_tests.py
